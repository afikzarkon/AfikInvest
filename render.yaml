# TASE scraping uses Puppeteer (Chrome). Free instances (~512MB RAM) often OOM or kill Chrome;
# if quotes still fail after deploy, upgrade this service to Starter or higher.
services:
  - type: web
    name: stockview-api
    env: node
    plan: free
    rootDir: .
    buildCommand: npm run render:build
    startCommand: node src/server.js
    envVars:
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/.cache/puppeteer

# Optional: run background jobs (alert scans, monthly PDF reports) in a separate
# process so Chrome never competes with the API for memory. Render background
# workers need a paid plan. If you enable this, also set JOBS_POLL=0 on the web
# service above so only the worker polls the job queue.
