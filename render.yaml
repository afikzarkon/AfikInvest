# TASE scraping uses Puppeteer (Chrome). Free instances (~512MB RAM) often OOM or kill Chrome;
# if quotes still fail after deploy, upgrade this service to Starter or higher.
services:
  - type: web
    # The Render service's name. Kept until the service is renamed in Render's
    # dashboard: if Render manages it from this file (a Blueprint), changing it
    # here first would create a second, empty service instead of renaming.
    name: stockview-api
    env: node
    plan: free
    rootDir: .
    buildCommand: npm run render:build
    startCommand: node src/server.js
    envVars:
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/.cache/puppeteer
      # Live US quotes from Finnhub (free key: finnhub.io/register). Set the
      # value in the Render dashboard; without it, quotes come from Yahoo.
      - key: FINNHUB_API_KEY
        sync: false

# Optional: run background jobs (alert scans, event calendar) in a separate
# process so they never compete with the API for memory. Render background
# workers need a paid plan. If you enable this, also set JOBS_POLL=0 on the web
# service above so only the worker polls the job queue.
